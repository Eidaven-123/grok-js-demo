<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Counter · Sean’s JS Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a class="active" href="counter.html">Counter</a>
    <a href="notes.html">Notes</a>
  </nav>
  <main class="card">
    <h1>Counter</h1>
    <p class="lede">Tap the buttons — count is live in the page (no reload).</p>
    <p class="count" id="count">0</p>
    <div class="row">
      <button type="button" id="dec">−</button>
      <button type="button" id="reset" class="ghost">Reset</button>
      <button type="button" id="inc">+</button>
    </div>
  </main>
  <script>
    let n = 0;
    const el = document.getElementById('count');
    const render = () => { el.textContent = String(n); };
    document.getElementById('inc').onclick = () => { n += 1; render(); };
    document.getElementById('dec').onclick = () => { n -= 1; render(); };
    document.getElementById('reset').onclick = () => { n = 0; render(); };
  </script>
</body>
</html>
